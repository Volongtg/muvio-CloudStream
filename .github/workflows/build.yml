name: Build and publish HHKungfu

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Prepare Gradle
        run: chmod +x ./gradlew

      - name: Set plugin version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("HHKungfu/build.gradle")
          s = p.read_text()
          import os, re
          version = os.environ["GITHUB_RUN_NUMBER"]
          s = re.sub(r'(?m)^version\s*=\s*\d+', f'version = {version}', s)
          p.write_text(s)
          PY

      - name: Build plugin and plugin index
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: ./gradlew HHKungfu:make makePluginsJson --no-daemon

      - name: Prepare repository files
        run: |
          rm -rf publish
          mkdir -p publish
          test -f HHKungfu/build/HHKungfu.cs3
          test -f build/plugins.json
          cp HHKungfu/build/HHKungfu.cs3 publish/HHKungfu.cs3
          cp build/plugins.json publish/plugins.json
          cat > publish/repo.json <<'JSON'
          {
            "name": "HHKUNGFU",
            "description": "Kho extension CloudStream cho HHKUNGFU",
            "manifestVersion": 1,
            "pluginLists": [
              "https://raw.githubusercontent.com/Volongtg/CloudStream/builds/plugins.json"
            ]
          }
          JSON
          echo "--- publish ---"
          ls -lh publish
          echo "--- plugins.json ---"
          cat publish/plugins.json

      - name: Publish builds branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin builds || true
          git checkout -B builds
          git rm -rf . || true
          cp -R publish/. .
          git add HHKungfu.cs3 plugins.json repo.json
          git commit -m "Publish HHKungfu build ${GITHUB_RUN_NUMBER}" || true
          git push origin builds --force
